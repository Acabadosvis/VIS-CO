<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><title>VIS-CO Auth</title>
<style>
  body{font-family:sans-serif;background:#F8F7F5;display:flex;align-items:center;
  justify-content:center;min-height:100vh;margin:0;text-align:center;color:#666;}
</style>
</head>
<body>
<div>
  <div style="font-size:28px;margin-bottom:10px">⏳</div>
  <div style="font-size:14px">Procesando autenticación...</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
  const BASE = 'https://vis-co-blond.vercel.app/cierres/';

  const app = new msal.PublicClientApplication({
    auth: {
      clientId: 'a3289496-21d5-4f4e-b033-7fb7339e2aa8',
      authority: 'https://login.microsoftonline.com/79cd3b5a-a384-4785-a983-74eace5f688d',
      redirectUri: BASE + 'auth.html'
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
  });

  app.handleRedirectPromise()
    .then(function(result) {
      if (result && result.account) {
        // Token obtenido — marcar y volver al módulo
        localStorage.setItem('visco_auth_just_connected', '1');
      }
      window.location.replace(BASE);
    })
    .catch(function(err) {
      console.error(err);
      window.location.replace(BASE + '?auth_error=' + encodeURIComponent(err.message));
    });
</script>
</body>
</html>
